<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF Storage in IndexedDB</title>
</head>
<body>

<h2>Upload PDF</h2>
<input type="file" id="fileInput" accept="application/pdf" />
<button onclick="saveSelectedPDF()">Save PDF</button>

<h2>Stored PDFs</h2>
<ul id="pdfList"></ul>

<h2>View PDF</h2>
<embed id="pdfViewer" width="600" height="800" type="application/pdf" />

<script>
// Define IndexedDB variables
const DB_NAME = 'pdfStore';
const STORE_NAME = 'pdfs';
let db;

// Open (or create) database
const request = indexedDB.open(DB_NAME, 1);

request.onupgradeneeded = function(event) {
    db = event.target.result;
    if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
    }
};

request.onsuccess = function(event) {
    db = event.target.result;
    displayPDFList();
};

request.onerror = function(event) {
    console.error("Database error:", event.target.error);
}

// Save selected PDF file into IndexedDB
function saveSelectedPDF() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    if (!file || file.type !== 'application/pdf') {
        alert('Please select a PDF file.');
        return;
    }
    const transaction = db.transaction(STORE_NAME, 'readwrite');
    const store = transaction.objectStore(STORE_NAME);
    store.add({ file: file, name: file.name, type: file.type });
    transaction.oncomplete = () => {
        alert('PDF saved!');
        displayPDFList();
    };
    transaction.onerror = () => {
        alert('Error saving PDF.');
    };
}

// Display list of saved PDFs
function displayPDFList() {
    const list = document.getElementById('pdfList');
    list.innerHTML = '';

    const transaction = db.transaction(STORE_NAME, 'readonly');
    const store = transaction.objectStore(STORE_NAME);
    store.openCursor().onsuccess = function(event) {
        const cursor = event.target.result;
        if (cursor) {
            const li = document.createElement('li');
            li.textContent = cursor.value.name;
            const viewBtn = document.createElement('button');
            viewBtn.textContent = 'View';
            viewBtn.onclick = () => loadAndDisplayPDF(cursor.key);
            li.appendChild(viewBtn);
            list.appendChild(li);
            cursor.continue();
        }
    };
}

// Load PDF by ID and display
function loadAndDisplayPDF(id) {
    const transaction = db.transaction(STORE_NAME, 'readonly');
    const store = transaction.objectStore(STORE_NAME);
    const request = store.get(id);
    request.onsuccess = function() {
        const item = request.result;
        if (item && item.file) {
            const url = URL.createObjectURL(item.file);
            document.getElementById('pdfViewer').src = url;
        }
    };
}
</script>

</body>
</html>
