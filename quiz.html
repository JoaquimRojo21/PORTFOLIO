<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz | My Portfolio</title>

<style>
/* Your existing styles... */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #070b14;
    color: white;
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 45px 45px;
}

nav {
    min-height: 75px;
    padding: 0 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(7,11,20,.95);
    border-bottom: 1px solid #202b40;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    color: #00e5ff;
}

.nav-links {
    display: flex;
    list-style: none;
    gap: 30px;
}

.nav-links a {
    color: #b8c2d9;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.nav-links a:hover {
    color: #00e5ff;
}

.container {
    width: 90%;
    max-width: 1200px;
    margin: 70px auto 120px;
}

.label {
    color: #00e5ff;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 12px;
}

h1 {
    font-size: 55px;
    margin-bottom: 35px;
}

h1 span {
    color: #00e5ff;
}

.upload-card {
    background: rgba(19,28,44,.75);
    border: 1px solid #263750;
    border-radius: 18px;
    padding: 35px;
    margin-bottom: 50px;
}

.upload-card p {
    color: #9ca8bd;
    line-height: 1.7;
    margin-bottom: 20px;
}

.file-label {
    display: inline-block;
    padding: 13px 22px;
    background: #111b2c;
    border: 1px solid #31435e;
    border-radius: 8px;
    color: #b9c6d9;
    cursor: pointer;
}

.file-label:hover {
    border-color: #00e5ff;
    color: #00e5ff;
}

#imageInput {
    display: none;
}

button {
    border: none;
    padding: 13px 23px;
    margin-left: 8px;
    border-radius: 7px;
    background: #00e5ff;
    color: #061019;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    transform: translateY(-2px);
}

.clear-all,
.delete-btn {
    background: #273247;
    color: white;
}

.selected-files {
    margin-top: 20px;
    color: #72829c;
    font-size: 13px;
}

.gallery-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

h2 {
    font-size: 22px;
}

.count {
    color: #00e5ff;
    font-size: 13px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    min-height: 80px;
}

.image-card {
    background: rgba(19,28,44,.75);
    border: 1px solid #263750;
    border-radius: 15px;
    padding: 12px;
}

.image-card img {
    width: 100%;
    height: 300px;
    object-fit: contain;
    background: #080d17;
    border-radius: 10px;
}

.delete-btn {
    width: 100%;
    margin: 10px 0 0;
}

.empty {
    grid-column: 1 / -1;
    padding: 20px 0;
    color: #8896b0;
    font-size: 16px;
}

@media(max-width:900px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:650px) {
    nav {
        padding: 20px;
        flex-direction: column;
        gap: 20px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    h1 {
        font-size: 42px;
    }

    .gallery {
        grid-template-columns: 1fr;
    }

    .upload-card {
        padding: 25px;
    }

    button {
        margin-top: 10px;
    }
}

/* Style for the shared images container */
#github-images {
    margin-top: 50px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        <span>&lt;</span> MY PORTFOLIO <span>/&gt;</span>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="quiz.html">QUIZ</a></li>
        <li><a href="laboratory.html">LABORATORY</a></li>
        <li><a href="exam.html">EXAM</a></li>
    </ul>
</nav>

<div class="container">

    <div class="label">
        ACADEMIC WORK
    </div>

    <h1>
        <span>QUIZ</span>
    </h1>

    <div class="upload-card">
        <label for="imageInput" class="file-label">+ CHOOSE IMAGES</label>
        <input type="file" id="imageInput" accept="image/*" multiple />
        <button onclick="addImages()">ADD SUBMISSION</button>
        <button class="clear-all" onclick="clearAll()">CLEAR ALL</button>
        <div class="selected-files" id="selectedFiles">No images selected.</div>
    </div>

    <div class="gallery-header">
        <h2>My Quiz Submissions</h2>
        <div class="count" id="imageCount">0 images</div>
    </div>

    <div class="gallery" id="gallery">
        <div class="empty">No submission yet.</div>
    </div>

    <!-- Container for sharing images from GitHub -->
    <div id="github-images">
        <!-- Your shared image will appear here -->
        <img src="https://raw.githubusercontent.com/joaquimrojo21/PORTFOLIO/main/images/quiz_screenshot.png" alt="Quiz Screenshot" style="width: 300px; border-radius: 8px;">
    </div>

</div>

<script>
const STORAGE_KEY = "quizSubmissions";

const input = document.getElementById("imageInput");
const selectedFiles = document.getElementById("selectedFiles");

input.addEventListener("change", function() {
    if (input.files.length === 0) {
        selectedFiles.textContent = "No images selected.";
        return;
    }
    selectedFiles.textContent = input.files.length + " image(s) selected.";
});

function getImages() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
        return [];
    }
    try {
        return JSON.parse(saved);
    } catch {
        return [];
    }
}

function saveImages(images) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(images));
}

function addImages() {
    if (input.files.length === 0) {
        alert("Please choose an image first.");
        return;
    }
    const files = Array.from(input.files);
    let images = getImages();
    let remaining = files.length;
    files.forEach(function(file) {
        if (!file.type.startsWith("image/")) {
            remaining--;
            return;
        }
        const reader = new FileReader();
        reader.onload = function(event) {
            images.push({ name: file.name, image: event.target.result });
            remaining--;
            if (remaining === 0) {
                saveImages(images);
                input.value = "";
                selectedFiles.textContent = "Images added successfully.";
                displayImages();
            }
        };
        reader.readAsDataURL(file);
    });
}

function displayImages() {
    const gallery = document.getElementById("gallery");
    const count = document.getElementById("imageCount");
    const images = getImages();
    count.textContent = images.length + (images.length === 1 ? " image" : " images");
    gallery.innerHTML = "";
    if (images.length === 0) {
        gallery.innerHTML = `<div class="empty">No submission yet.</div>`;
        return;
    }
    images.forEach(function(item, index) {
        const card = document.createElement("div");
        card.className = "image-card";
        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.name;
        const button = document.createElement("button");
        button.className = "delete-btn";
        button.textContent = "DELETE";
        button.onclick = function() {
            deleteImage(index);
        };
        card.appendChild(img);
        card.appendChild(button);
        gallery.appendChild(card);
    });
}

function deleteImage(index) {
    const images = getImages();
    images.splice(index, 1);
    saveImages(images);
    displayImages();
}

function clearAll() {
    if (!confirm("Delete ALL quiz submissions?")) {
        return;
    }
    localStorage.removeItem(STORAGE_KEY);
    displayImages();
    selectedFiles.textContent = "No images selected.";
}

// Load existing images on page load
displayImages();

// --- Load images from your GitHub site ---
const githubImageUrls = [
    // Replace these URLs with your actual images
    "https://raw.githubusercontent.com/joaquimrojo21/PORTFOLIO/main/images/sample1.jpg",
    "https://raw.githubusercontent.com/joaquimrojo21/PORTFOLIO/main/images/sample2.jpg"
];

const githubContainer = document.getElementById('github-images');

githubImageUrls.forEach(url => {
    const img = document.createElement('img');
    img.src = url;
    img.alt = "Shared Image";
    img.style.width = "200px"; // adjust size as needed
    img.style.height = "auto";
    img.style.borderRadius = "10px";
    img.style.objectFit = "cover";

    githubContainer.appendChild(img);
});
</script>

</body>
</html>
