<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz | My Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #070b14;
    color: white;
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 45px 45px;
}

nav {
    min-height: 75px;
    padding: 0 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(7,11,20,.95);
    border-bottom: 1px solid #202b40;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    color: #00e5ff;
}

.nav-links {
    display: flex;
    list-style: none;
    gap: 30px;
}

.nav-links a {
    color: #b8c2d9;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

.nav-links a:hover {
    color: #00e5ff;
}

.container {
    width: 90%;
    max-width: 1200px;
    margin: 70px auto 120px;
}

.label {
    color: #00e5ff;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 12px;
}

h1 {
    font-size: 55px;
    margin-bottom: 35px;
}

h1 span {
    color: #00e5ff;
}

.gallery-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.gallery-header h2 {
    font-size: 22px;
}

.count {
    color: #00e5ff;
    font-size: 13px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    min-height: 80px;
}

.image-card {
    background: rgba(19,28,44,.75);
    border: 1px solid #263750;
    border-radius: 15px;
    padding: 12px;
}

.image-card img {
    width: 100%;
    height: 300px;
    object-fit: contain;
    background: #080d17;
    border-radius: 10px;
}

.image-card .caption {
    margin-top: 10px;
    text-align: center;
    color: #8896b0;
    font-size: 13px;
}

.empty {
    grid-column: 1 / -1;
    padding: 20px 0;
    color: #8896b0;
    font-size: 16px;
}

@media(max-width:900px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:650px) {
    nav {
        padding: 20px;
        flex-direction: column;
        gap: 20px;
    }

    .nav-links {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
    }

    h1 {
        font-size: 42px;
    }

    .gallery {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<nav>
    <div class="logo">
        <span>&lt;</span> MY PORTFOLIO <span>/&gt;</span>
    </div>

    <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="quiz.html">QUIZ</a></li>
        <li><a href="laboratory.html">LABORATORY</a></li>
        <li><a href="exam.html">EXAM</a></li>
    </ul>
</nav>

<div class="container">

    <div class="label">
        ACADEMIC WORK
    </div>

    <h1>
        <span>QUIZ</span>
    </h1>

    <div class="gallery-header">
        <h2>My Quiz Submissions</h2>
        <div class="count" id="imageCount">0 images</div>
    </div>

    <div class="gallery" id="gallery">
        <div class="empty">No submissions yet.</div>
    </div>

</div>

<script>
/*
  HOW TO ADD YOUR QUIZ IMAGES:
  1. Upload your image files into a folder called "quiz-images" inside this
     same GitHub repo (next to this quiz.html file).
  2. Add each filename to the list below, with an optional caption.
  3. Commit / push to GitHub — the images will show for every visitor.
*/
const quizImages = [
    // { file: "quiz-images/quiz1.jpg", caption: "Quiz 1 - Chapter 2" },
    // { file: "quiz-images/quiz2.jpg", caption: "Quiz 2 - Chapter 3" },
];

function displayImages() {
    const gallery = document.getElementById("gallery");
    const count = document.getElementById("imageCount");

    count.textContent =
        quizImages.length +
        (quizImages.length === 1 ? " image" : " images");

    gallery.innerHTML = "";

    if (quizImages.length === 0) {
        gallery.innerHTML = `<div class="empty">No submissions yet.</div>`;
        return;
    }

    quizImages.forEach(function (item) {
        const card = document.createElement("div");
        card.className = "image-card";

        const img = document.createElement("img");
        img.src = item.file;
        img.alt = item.caption || "Quiz submission";

        card.appendChild(img);

        if (item.caption) {
            const caption = document.createElement("div");
            caption.className = "caption";
            caption.textContent = item.caption;
            card.appendChild(caption);
        }

        gallery.appendChild(card);
    });
}

displayImages();
</script>

</body>
</html>
